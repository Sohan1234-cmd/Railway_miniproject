<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Railway / Bus Reservation</title>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --bg: #ecf0f1; --text: #333; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; }
        header { background: var(--primary); color: white; padding: 20px; text-align: center; }
        header h1 { margin: 0; }
        .nav { display: flex; background: #34495e; }
        .nav button { flex: 1; padding: 15px; border: none; background: none; color: white; cursor: pointer; font-size: 16px; transition: 0.3s; }
        .nav button:hover, .nav button.active { background: var(--accent); }
        .content { padding: 25px; display: none; }
        .content.active { display: block; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn { background: var(--accent); color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; width: 100%; }
        .btn:hover { background: #2980b9; }
        .seat-map { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-top: 20px; }
        .seat { padding: 15px; text-align: center; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .seat.available { background: #2ecc71; color: white; }
        .seat.booked { background: #e74c3c; color: white; cursor: not-allowed; }
        .alert { padding: 15px; margin-bottom: 15px; border-radius: 5px; display: none; }
        .alert.success { background: #d4edda; color: #155724; display: block; }
        .alert.error { background: #f8d7da; color: #721c24; display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: var(--primary); color: white; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🚆 Railway / Bus Ticket Reservation</h1>
    </header>
    
    <div class="nav">
        <button onclick="showTab('book')" class="active">Book Ticket</button>
        <button onclick="showTab('cancel')">Cancel Ticket</button>
        <button onclick="showTab('seats')">Seat Map</button>
        <button onclick="showTab('waitlist')">Waiting List</button>
        <button onclick="showTab('stats')">Statistics</button>
    </div>

    <!-- Book Ticket Tab -->
    <div id="book" class="content active">
        <div id="book-alert" class="alert"></div>
        <div class="form-group"><label>Passenger Name</label><input type="text" id="name" placeholder="John Doe"></div>
        <div class="form-group"><label>Phone Number</label><input type="text" id="phone" placeholder="9876543210"></div>
        <div class="form-group"><label>Bus/Train No</label><input type="text" id="bus" placeholder="BUS-101"></div>
        <div class="form-group"><label>Journey Date</label><input type="date" id="date"></div>
        <div class="form-group"><label>Fare (Rs.)</label><input type="number" id="fare" placeholder="500"></div>
        <button class="btn" onclick="bookTicket()">Confirm Booking</button>
    </div>

    <!-- Cancel Ticket Tab -->
    <div id="cancel" class="content">
        <div id="cancel-alert" class="alert"></div>
        <div class="form-group"><label>Enter PNR to Cancel</label><input type="text" id="cancel-pnr" placeholder="PNR0000001"></div>
        <button class="btn" style="background: #e74c3c;" onclick="cancelTicket()">Cancel Ticket</button>
    </div>

    <!-- Seat Map Tab -->
    <div id="seats" class="content">
        <h3>Seat Map (40 Seats)</h3>
        <p><span class="seat available" style="display:inline-block; padding: 5px 10px;">Available</span> <span class="seat booked" style="display:inline-block; padding: 5px 10px;">Booked</span></p>
        <div class="seat-map" id="seat-map-container"></div>
    </div>

    <!-- Waiting List Tab -->
    <div id="waitlist" class="content">
        <h3>Waiting List (Queue)</h3>
        <table>
            <thead><tr><th>#</th><th>PNR</th><th>Name</th><th>Phone</th></tr></thead>
            <tbody id="waitlist-body"></tbody>
        </table>
    </div>

    <!-- Statistics Tab -->
    <div id="stats" class="content">
        <h3>System Statistics</h3>
        <table>
            <tr><th>Total Seats</th><td>40</td></tr>
            <tr><th>Booked Seats</th><td id="stat-booked">0</td></tr>
            <tr><th>Available Seats</th><td id="stat-available">40</td></tr>
            <tr><th>Waitlist Count</th><td id="stat-waitlist">0</td></tr>
            <tr><th>Total Revenue</th><td id="stat-revenue">Rs. 0</td></tr>
        </table>
    </div>
</div>

<script>
    // Mimicking your C structures
    const TOTAL_SEATS = 40;
    let seats = Array(TOTAL_SEATS).fill(null); // null = available
    let waitlist = []; 
    let pnrCounter = 1;

    // Load from local storage if exists
    if(localStorage.getItem('railwayData')) {
        const data = JSON.parse(localStorage.getItem('railwayData'));
        seats = data.seats;
        waitlist = data.waitlist;
        pnrCounter = data.pnrCounter;
    }

    function saveData() {
        localStorage.setItem('railwayData', JSON.stringify({seats, waitlist, pnrCounter}));
        updateUI();
    }

    function showTab(tabId) {
        document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.target.classList.add('active');
    }

    function showAlert(id, msg, type) {
        const el = document.getElementById(id);
        el.className = `alert ${type}`;
        el.innerText = msg;
        setTimeout(() => el.style.display = 'none', 5000);
    }

    function bookTicket() {
        const name = document.getElementById('name').value;
        const phone = document.getElementById('phone').value;
        const bus = document.getElementById('bus').value;
        const date = document.getElementById('date').value;
        const fare = parseInt(document.getElementById('fare').value) || 0;

        if(!name || !phone || !bus || !date) {
            showAlert('book-alert', 'Please fill all fields!', 'error');
            return;
        }

        const pnr = "PNR" + String(pnrCounter).padStart(7, '0');
        const passenger = { pnr, name, phone, bus, date, fare, seatNo: -1 };
        
        let seatIndex = seats.findIndex(s => s === null);
        
        if(seatIndex !== -1) {
            passenger.seatNo = seatIndex;
            seats[seatIndex] = passenger;
            showAlert('book-alert', `[CONFIRMED] Seat ${seatIndex + 1} booked. PNR: ${pnr}`, 'success');
        } else {
            waitlist.push(passenger);
            showAlert('book-alert', `[WAITLISTED] Coach full. PNR: ${pnr}`, 'success');
        }
        
        pnrCounter++;
        document.querySelectorAll('input').forEach(i => i.value = '');
        saveData();
    }

    function cancelTicket() {
        const pnr = document.getElementById('cancel-pnr').value;
        let found = false;

        // Check confirmed seats
        for(let i=0; i<seats.length; i++) {
            if(seats[i] && seats[i].pnr === pnr) {
                seats[i] = null;
                found = true;
                showAlert('cancel-alert', `[OK] Ticket cancelled. Seat freed.`, 'success');
                
                // Auto-promote from waitlist
                if(waitlist.length > 0) {
                    let promoted = waitlist.shift();
                    promoted.seatNo = i;
                    seats[i] = promoted;
                    showAlert('cancel-alert', `[OK] Cancelled. Waitlisted passenger ${promoted.name} auto-confirmed on Seat ${i+1}`, 'success');
                }
                break;
            }
        }

        // Check waitlist
        if(!found) {
            const wIndex = waitlist.findIndex(w => w.pnr === pnr);
            if(wIndex !== -1) {
                waitlist.splice(wIndex, 1);
                found = true;
                showAlert('cancel-alert', `[OK] Removed from waiting list.`, 'success');
            }
        }

        if(!found) showAlert('cancel-alert', '[ERROR] PNR not found.', 'error');
        
        document.getElementById('cancel-pnr').value = '';
        saveData();
    }

    function updateUI() {
        // Seat Map
        const mapContainer = document.getElementById('seat-map-container');
        mapContainer.innerHTML = '';
        let bookedCount = 0;
        let revenue = 0;

        seats.forEach((s, i) => {
            const div = document.createElement('div');
            div.className = `seat ${s ? 'booked' : 'available'}`;
            div.innerText = i + 1;
            if(s) { bookedCount++; revenue += s.fare; }
            mapContainer.appendChild(div);
        });

        // Waitlist Table
        const wBody = document.getElementById('waitlist-body');
        wBody.innerHTML = '';
        waitlist.forEach((w, i) => {
            wBody.innerHTML += `<tr><td>${i+1}</td><td>${w.pnr}</td><td>${w.name}</td><td>${w.phone}</td></tr>`;
        });

        // Stats
        document.getElementById('stat-booked').innerText = bookedCount;
        document.getElementById('stat-available').innerText = TOTAL_SEATS - bookedCount;
        document.getElementById('stat-waitlist').innerText = waitlist.length;
        document.getElementById('stat-revenue').innerText = `Rs. ${revenue}`;
    }

    // Initialize UI
    updateUI();
</script>
</body>
</html>
